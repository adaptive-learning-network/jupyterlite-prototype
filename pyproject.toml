[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.2.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlite_al_engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = ["Framework :: Jupyter", "Framework :: Jupyter :: JupyterLab :: 4", "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt"]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["al_engine/labextension"]
exclude = [".github", "node_modules", ".venv", "_output"]

[tool.hatch.build.targets.wheel.shared-data]
"al_engine/labextension" = "share/jupyter/labextensions/jupyterlite-al-engine"

[tool.hatch.build.hooks.version]
path = "al_engine/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["al_engine/labextension/static/style.js", "al_engine/labextension/package.json"]
skip-if-exists = ["al_engine/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build"
npm = ["jlpm"]
source_dir = "src"
build_dir = "al_engine/labextension"
