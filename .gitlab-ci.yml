stages:
  - deploy
publish-jupyterlite:
  image: node:20-bookworm
  tags:
    - docker
  stage: deploy
  variables:
    AL_ONTOLOGY_DIR: "$CI_PROJECT_DIR/.tools/ontology"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.tools/pip-cache"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-venv python3-pip r-base curl bzip2 git
    - mkdir -p .tools
    - |
      cat > .tools/git-askpass.sh <<'SH'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' gitlab-ci-token ;;
        *Password*) printf '%s\n' "$CI_JOB_TOKEN" ;;
      esac
      SH
      chmod 700 .tools/git-askpass.sh
      GIT_ASKPASS="$PWD/.tools/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
        git clone --quiet "https://$CI_SERVER_HOST/adaptive-learning/adaptive-learning-ontology.git" "$AL_ONTOLOGY_DIR"
  script:
    - SKIP_PLAYWRIGHT=1 scripts/setup.sh
    - .venv/bin/python "$AL_ONTOLOGY_DIR/scripts/validate.py"
    - .venv/bin/jlpm build:site
    - .venv/bin/jlpm test:checks
    # GitHub Actions runs the full Playwright browser suite on the same main commit.
    - mv _output public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
